name: ginzan-check

on:
  schedule:
    - cron: "7,37 * * * *"  # 每 30 分鐘（第 7 同 37 分鐘）
  workflow_dispatch:
    inputs:
      test_dates:
        description: "測試用入住日（例如 2026-11-03）。留空 = 正常跑"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ginzan-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check vacancies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          TEST_DATES: ${{ github.event.inputs.test_dates }}
        run: |
          if [ -n "$TEST_DATES" ]; then
            python3 check.py --dates "$TEST_DATES"
          else
            python3 check.py
          fi

      - name: Save state
        run: |
          git config user.name "ginzan-bot"
          git config user.email "ginzan-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
